<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form 37</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991112.png" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #FFFFF0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    .container { width: 100%; height: 100vh; height: -webkit-fill-available; display: flex; flex-direction: column; }
    .iframe-container { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; background: #f1f5f9; }
    /* CSS Loading Circular Progress + Glassmorphism (Sama seperti sebelumnya) */
    .loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 50%, #dbeafe 100%); z-index: 10; transition: opacity 0.5s ease; }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .glass-card { padding: 50px 60px; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.5); display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .spinner-wrap { position: relative; width: 64px; height: 64px; }
    .spinner-ring { width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(103, 58, 183, 0.15); border-top-color: #673ab7; border-right-color: #512da8; animation: spin 0.9s linear infinite; box-shadow: 0 2px 8px rgba(103, 58, 183, 0.2); }
    .spinner-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; background: #673ab7; border-radius: 50%; box-shadow: 0 0 12px rgba(103, 58, 183, 0.5); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.6; } }
    .loading-text { font-size: 0.9rem; font-weight: 600; color: #312e81; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5); }
    .loading-text::after { content: ''; animation: dots 1.5s infinite; }
    @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading" id="loading">
      <div class="glass-card">
        <div class="spinner-wrap">
          <div class="spinner-ring"></div>
          <div class="spinner-inner"></div>
        </div>
        <p class="loading-text">Memuat Aplikasi</p>
      </div>
    </div>
    <div class="iframe-container">
      <iframe id="appFrame" src="" allow="fullscreen; camera; microphone" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
    </div>
  </div>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbw6dYVA2Rrza2cf7rcP9-3OuO1gc5fCQEUyM3nGqe2vuM2ZfjeIaxCYAL729lZDApz-Gg/exec";
    var appFrame = document.getElementById('appFrame');
    var loading = document.getElementById('loading');

    window.addEventListener('message', function(event) {
      try {
        var data = event.data;
        if (!data || typeof data !== 'object') return;
        if (data.action === 'openBlank') { window.open('', '_blank'); return; }
        if (data.action === 'openDownload' && data.url) { window.open(data.url, '_blank'); return; }
        if (data.action === 'requestFullscreen') {
          var el = document.documentElement;
          var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (fn) fn.call(el).catch(function(){});
          return;
        }
      } catch(e) { console.warn('PostMessage error:', e); }
    });

    var startTime = Date.now();
    var MIN_LOAD_TIME = 3000;
    
    function loadApp() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var targetUrl = APP_URL;
      
      if (id) {
        targetUrl += "?page=respond&id=" + id;
        // Teruskan semua parameter pra-formulir (pf_*)
        params.forEach(function(value, key) {
          if (key !== 'id' && key !== 'page') {
            targetUrl += "&" + key + "=" + encodeURIComponent(value);
          }
        });
      } else {
        targetUrl += "?page=home";
      }
      
      appFrame.src = targetUrl;
    }
    
    function hideLoading() { loading.classList.add('hidden'); }

    appFrame.addEventListener('load', function() {
      var elapsedTime = Date.now() - startTime;
      var remainingTime = MIN_LOAD_TIME - elapsedTime;
      if (remainingTime > 0) { setTimeout(hideLoading, remainingTime); } 
      else { hideLoading(); }
    });
    
    window.addEventListener('DOMContentLoaded', loadApp);
  </script>
</body>
</html>
