<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unduh LJK</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9805/9805578.png" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      width: 100%; 
      height: 100%; 
      background: #FFFFF0; 
      font-family: 'Segoe UI', sans-serif; 
      overflow: hidden; 
    }
    
    .container { 
      width: 100%; 
      height: 100vh; 
      height: -webkit-fill-available; 
      display: flex; 
      flex-direction: column; 
    }
    
    .iframe-container { 
      flex: 1; 
      width: 100%; 
      height: 100%; 
      position: relative; 
      overflow: hidden; 
    }
    
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      background: #f1f5f9; 
    }
    
    /* ========================================
       LOADING SCREEN - CIRCULAR PROGRESS + PERSENTASE
       Tanpa kotak, glassmorphism hanya di elemen loading
       ======================================== */
    .loading { 
      position: fixed; 
      top: 0; 
      left: 0;
      width: 100%; 
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 50%, #dbeafe 100%);
      z-index: 10; 
      transition: opacity 0.5s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Container loading - tanpa kotak, hanya flex center */
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Circular Progress - SVG style untuk persentase */
    .progress-container {
      position: relative;
      width: 90px;
      height: 90px;
    }

    .progress-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      filter: drop-shadow(0 2px 8px rgba(103, 58, 183, 0.2));
    }

    .progress-track {
      fill: none;
      stroke: rgba(103, 58, 183, 0.15);
      stroke-width: 5;
    }

    .progress-fill {
      fill: none;
      stroke: url(#progressGradient);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 251.2;
      stroke-dashoffset: 251.2;
      transition: stroke-dashoffset 0.1s linear;
    }

    /* Persentase di tengah lingkaran */
    .progress-percent {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.4rem;
      font-weight: 700;
      color: #312e81;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
      font-variant-numeric: tabular-nums;
    }

    .progress-percent::after {
      content: '%';
      font-size: 0.9rem;
      font-weight: 600;
      margin-left: 1px;
      opacity: 0.7;
    }

    .loading-text {
      font-size: 0.85rem;
      font-weight: 600;
      color: #312e81;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
      opacity: 0.85;
    }

    .loading-text::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

  </style>
</head>
<body>
  <div class="container">
    
    <!-- Loading Screen - Circular Progress + Persentase (tanpa kotak) -->
    <div class="loading" id="loading">
      <div class="loading-content">
        <div class="progress-container">
          <svg class="progress-svg" viewBox="0 0 90 90">
            <defs>
              <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#673ab7"/>
                <stop offset="100%" stop-color="#512da8"/>
              </linearGradient>
            </defs>
            <circle class="progress-track" cx="45" cy="45" r="40"/>
            <circle class="progress-fill" id="progressFill" cx="45" cy="45" r="40"/>
          </svg>
          <div class="progress-percent" id="progressPercent">0</div>
        </div>
        <p class="loading-text">Memuat Aplikasi</p>
      </div>
    </div>

    <div class="iframe-container">
      <!-- allow-popups-to-escape-sandbox: agar tab baru dari iframe TIDAK ter-sandbox -->
      <iframe id="appFrame" src="" allow="fullscreen; camera; microphone" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
    </div>
  </div>

  <script>
    // =============================================
    // URL Google Apps Script Anda
    // =============================================
    var APP_URL = "https://script.google.com/macros/s/AKfycbwywqeJKH3NJQqoySyRIc5th47PKQ7ErdQhtWZMDq8TNhr_ySbSVlGb766gCqEie5fi0A/exec";
    
    var appFrame = document.getElementById('appFrame');
    var loading = document.getElementById('loading');
    var progressFill = document.getElementById('progressFill');
    var progressPercent = document.getElementById('progressPercent');

    // =============================================
    // HANDLER REQUEST DARI IFRAME
    // =============================================
    window.addEventListener('message', function(event) {
      try {
        var data = event.data;
        if (!data || typeof data !== 'object') return;

        // 1. Buka tab kosong atas nama parent (user gesture masih aktif)
        if (data.action === 'openBlank') {
          window.open('', '_blank');
          return;
        }

        // 2. Buka URL langsung dari parent (fallback jika langsung berhasil)
        if (data.action === 'openDownload' && data.url) {
          window.open(data.url, '_blank');
          return;
        }

        // 3. Fullscreen dari parent document
        if (data.action === 'requestFullscreen') {
          var el = document.documentElement;
          var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (fn) fn.call(el).catch(function(){});
          return;
        }
      } catch(e) {
        console.warn('PostMessage error:', e);
      }
    });

    // =============================================
    // LOGIKA PERSENTASE + DELAY 3 DETIK
    // =============================================
    var MIN_LOAD_TIME = 3000;
    var CIRCUMFERENCE = 251.2; // 2 * π * r (r=40)
    var startTime = Date.now();
    
    // Update persentase setiap 30ms untuk animasi halus
    var progressInterval = setInterval(function() {
      var elapsed = Date.now() - startTime;
      var percent = Math.min(100, Math.round((elapsed / MIN_LOAD_TIME) * 100));
      
      // Update angka persentase
      progressPercent.textContent = percent;
      
      // Update lingkaran progress (stroke-dashoffset)
      var offset = CIRCUMFERENCE - (percent / 100) * CIRCUMFERENCE;
      progressFill.style.strokeDashoffset = offset;
      
      if (percent >= 100) {
        clearInterval(progressInterval);
      }
    }, 30);
    
    function loadApp() {
      var fullUrl = window.location.href;
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      
      var targetUrl = APP_URL;
      
      if (id) {
        if (targetUrl.indexOf('?') !== -1) {
             targetUrl += "&id=" + id;
        } else {
             targetUrl += "?id=" + id;
        }
      }
      
      appFrame.src = targetUrl;
    }
    
    function hideLoading() {
      loading.classList.add('hidden');
    }

    appFrame.addEventListener('load', function() {
      var elapsedTime = Date.now() - startTime;
      var remainingTime = MIN_LOAD_TIME - elapsedTime;

      if (remainingTime > 0) {
        setTimeout(hideLoading, remainingTime);
      } else {
        hideLoading();
      }
    });
    
    window.addEventListener('DOMContentLoaded', loadApp);
  </script>
</body>
</html>
